<!DOCTYPE html>
<html>
<head>
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Premium Section -->
        <div class="premium-box">
            <h2>Premium Features</h2>
            <p>Listen without limits. Try Premium for better experience.</p>
            <div class="checkboxes">
                <label><input type="checkbox"> Try Premium</label>
                <label><input type="checkbox" checked> Profile</label>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search songs, artists..." onkeyup="searchSongs()">
        </div>

        <!-- Login Button -->
        <button class="login-btn">Login</button>

        <!-- Trending Now -->
        <div class="trending">
            <h3>Trending Now</h3>
            <div class="songs" id="songList">
                <!-- Songs yahan load honge -->
            </div>
        </div>

        <!-- Audio Player -->
        <audio id="audioPlayer" hidden></audio>
    </div>

    <script src="script.js"></script>
</body>
</html>
