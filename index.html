<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APNA MUSIC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">APNA <span>MUSIC</span></div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search songs, artists...">
                <button onclick="searchSongs()">🔍</button>
            </div>
        </header>

        <main>
            <section class="trending-section" id="trendingSection">
                <h2 class="section-title">Trending Music 🔥</h2>
                <div class="songs-grid" id="trendingSongs">
                    <!-- Songs load honge yaha -->
                </div>
            </section>

            <section class="search-results" id="searchResults">
                <button class="back-button" onclick="showTrending()">← Back to Trending</button>
                <h2 class="section-title">Search Results</h2>
                <div class="songs-grid" id="searchResultsGrid">
                    <!-- Search results yaha aayenge -->
                </div>
            </section>

            <div class="loading" id="loading" style="display: none;">
                Loading songs...
            </div>
        </main>
    </div>

    <div class="music-player" id="musicPlayer">
        <div class="player-controls">
            <div class="song-info">
                <div class="song-image">🎵</div>
                <div>
                    <div class="song-title" id="nowPlayingTitle">Song Title</div>
                    <div class="song-artist" id="nowPlayingArtist">Artist</div>
                </div>
            </div>
            
            <div class="control-buttons">
                <button class="control-btn">⏮</button>
                <button class="control-btn play-btn" id="playBtn">▶</button>
                <button class="control-btn">⏭</button>
            </div>

            <div class="progress-bar">
                <div class="progress-container">
                    <div class="progress" id="progress"></div>
                </div>
            </div>

            <div class="volume-control">
                <button class="control-btn">🔊</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
