<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APNA MUSIC</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <i class="fas fa-music"></i>
                <span>APNA MUSIC</span>
            </div>
            
            <!-- Navigation Menu -->
            <nav class="nav-menu">
                <a href="#" class="nav-link active">Home</a>
                <a href="#" class="nav-link">Profile</a>
                <a href="#" class="nav-link">Contacts</a>
            </nav>

            <!-- Search Bar -->
            <div class="search-container">
                <div class="glowing-input">
                    <input type="text" id="searchInput" placeholder="Search songs, artists...">
                    <span class="focus-border"></span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <h1 class="section-title">Trending Now 🔥</h1>
            
            <!-- Songs Grid -->
            <div class="songs-grid" id="trendingSongs">
                <!-- Songs will load here -->
            </div>

            <!-- Lyrics Section -->
            <div class="lyrics-container" id="lyricsContainer">
                <h3>Now Playing</h3>
                <div id="lyricsContent"></div>
            </div>

            <!-- Social Media -->
            <div class="social-section">
                <h3>Connect With Us</h3>
                <div class="social-container">
                    <div class="icon facebook" onclick="openFacebook()">
                        <div class="tooltip">Facebook</div>
                        <span><i class="fab fa-facebook-f"></i></span>
                    </div>
                    <div class="icon youtube" onclick="openYouTube()">
                        <div class="tooltip">YouTube</div>
                        <span><i class="fab fa-youtube"></i></span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Music Player -->
    <div class="music-player" id="musicPlayer">
        <div class="player-controls">
            <!-- Song Info -->
            <div class="song-info">
                <div class="current-song-image">🎵</div>
                <div class="song-details">
                    <div class="song-title" id="nowPlayingTitle">Select a song</div>
                    <div class="song-artist" id="nowPlayingArtist">Artist</div>
                </div>
            </div>

            <!-- Control Buttons -->
            <div class="control-buttons">
                <button class="control-btn" onclick="previousSong()">
                    <i class="fas fa-step-backward"></i>
                </button>
                <button class="control-btn play-btn" id="playBtn" onclick="togglePlay()">
                    <i class="fas fa-play" id="playIcon"></i>
                </button>
                <button class="control-btn" onclick="nextSong()">
                    <i class="fas fa-step-forward"></i>
                </button>
            </div>

            <!-- Progress Bar -->
            <div class="progress-section">
                <span class="time" id="currentTime">0:00</span>
                <div class="progress-bar" onclick="seekSong(event)">
                    <div class="progress" id="progress"></div>
                </div>
                <span class="time" id="totalTime">0:00</span>
            </div>

            <!-- Volume Control -->
            <div class="volume-control">
                <i class="fas fa-volume-up"></i>
                <input type="range" id="volumeSlider" min="0" max="100" value="50" onchange="changeVolume(this.value)">
            </div>
        </div>
    </div>

    <!-- Audio Element -->
    <audio id="audioPlayer" preload="metadata"></audio>

    <script src="script.js"></script>
</body>
</html>
