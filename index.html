<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicWave - Modern Music Player</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">
    <!-- Navigation -->
    <nav class="glass-nav">
        <div class="logo">
            <h1 class="animated-text">🎵 MusicWave</h1>
        </div>
        <div class="search-container">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search songs, artists... 🔍">
                <button onclick="searchMusic()">Search</button>
            </div>
        </div>
        <div class="theme-toggle">
            <button onclick="toggleTheme()">🌙</button>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        <!-- Music Player -->
        <div class="music-player glass">
            <div class="album-art-container">
                <div class="album-art">
                    <img id="albumImage" src="https://via.placeholder.com/300" alt="Album Art">
                    <div class="rotating-disc"></div>
                    <div class="play-pulse"></div>
                </div>
            </div>
            
            <div class="player-controls">
                <h2 id="songTitle" class="song-title">Select a Song</h2>
                <p id="artistName" class="artist-name">Artist Name</p>
                
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress" id="progress"></div>
                    </div>
                    <div class="time-display">
                        <span id="currentTime">0:00</span>
                        <span id="duration">0:00</span>
                    </div>
                </div>
                
                <div class="controls">
                    <button class="control-btn" onclick="previousSong()">⏮</button>
                    <button class="control-btn play-btn" onclick="togglePlay()" id="playBtn">▶️</button>
                    <button class="control-btn" onclick="nextSong()">⏭</button>
                </div>

                <div class="volume-control">
                    <span>🔊</span>
                    <input type="range" id="volume" min="0" max="1" step="0.1" value="0.7" onchange="setVolume(this.value)">
                </div>
            </div>
        </div>

        <!-- Lyrics Section -->
        <div class="lyrics-section glass">
            <h3 class="section-title">🎤 Lyrics</h3>
            <div id="lyrics" class="lyrics-text">
                <p class="placeholder-text">Search and play a song to view lyrics</p>
            </div>
        </div>

        <!-- Song List -->
        <div class="song-list">
            <h3 class="section-title">🔥 Trending Songs</h3>
            <div id="songContainer" class="songs-grid">
                <!-- Songs will be loaded here -->
            </div>
        </div>
    </main>

    <!-- Audio Element -->
    <audio id="audioPlayer" preload="metadata"></audio>

    <script src="script.js"></script>
</body>
</html>
