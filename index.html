<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apna Music</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Stars Background -->
    <div class="stars" id="stars"></div>

    <div class="container">
        <!-- First Page -->
        <div class="first-page" id="firstPage">
            <div class="header">
                <div class="logo">APNA MUSIC</div>
                <div>Home Search Your Library</div>
            </div>

            <!-- Premium Section -->
            <div class="premium-section">
                <h3>Premium Features</h3>
                <p>Listen without limits. Try Premium for better experience.</p>
                <button class="btn premium-btn">Try Premium</button>
                <button class="btn login-btn">Profile</button>
            </div>

            <!-- Big Search Bar -->
            <div class="search-container">
                <input type="text" class="search-box" id="searchBox" 
                       placeholder="Search any song...">
            </div>

            <!-- Minimize Button -->
            <div class="minimize-section">
                <button class="btn minimize-btn" onclick="minimizeFirstPage()">
                    Minimize First Page
                </button>
            </div>

            <!-- Login Button -->
            <div class="login-section">
                <button class="btn login-btn">Login</button>
            </div>
        </div>

        <!-- Second Page -->
        <div class="second-page" id="secondPage">
            <h3>Search Results</h3>
            <div class="now-playing" id="nowPlaying">
                Select any song to play...
            </div>
            <div class="song-list" id="songList">
                <!-- Songs will appear here -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
