<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APNA MUSIC</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-music"></i>
                APNA MUSIC
            </div>
            
            <nav class="nav-menu">
                <a href="#" class="nav-link active">Home</a>
                <a href="#" class="nav-link">Profile</a>
                <a href="#" class="nav-link">Contacts</a>
            </nav>

            <div class="search-container">
                <div class="glowing-input">
                    <input type="text" id="searchInput" placeholder="Search any song...">
                    <span class="focus-border"></span>
                </div>
            </div>
        </header>

        <main>
            <section class="trending-section" id="trendingSection">
                <h2 class="section-title">Trending Now 🔥</h2>
                <div class="songs-grid" id="trendingSongs">
                    <!-- Default songs yaha aayenge -->
                </div>
            </section>

            <section class="search-results" id="searchResults">
                <h2 class="section-title">Search Results</h2>
                <div class="songs-grid" id="searchResultsGrid">
                    <!-- Search results yaha aayenge -->
                </div>
            </section>
        </main>
    </div>

    <!-- Music Player -->
    <div class="music-player" id="musicPlayer">
        <div class="player-controls">
            <div class="song-info">
                <div class="current-song-image">🎵</div>
                <div class="song-details">
                    <div class="song-title" id="nowPlayingTitle">Select a song</div>
                    <div class="song-artist" id="nowPlayingArtist">Artist</div>
                </div>
            </div>

            <div class="control-buttons">
                <button class="control-btn" onclick="previousSong()">
                    <i class="fas fa-step-backward"></i>
                </button>
                <button class="control-btn play-btn" id="playBtn" onclick="togglePlay()">
                    <i class="fas fa-play" id="playIcon"></i>
                </button>
                <button class="control-btn" onclick="nextSong()">
                    <i class="fas fa-step-forward"></i>
                </button>
            </div>

            <div class="progress-section">
                <span class="time" id="currentTime">0:00</span>
                <div class="progress-bar" onclick="seekSong(event)">
                    <div class="progress" id="progress"></div>
                </div>
                <span class="time" id="totalTime">0:00</span>
            </div>
        </div>
    </div>

    <!-- YouTube Player -->
    <div id="youtubePlayer" style="display: none;"></div>

    <script src="script.js"></script>
</body>
</html>
