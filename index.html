<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Premium Features Section -->
        <div class="premium-section">
            <h2>Premium Features</h2>
            <p>Listen without limits. Try Premium for better experience.</p>
            
            <div class="premium-options">
                <div class="option">
                    <input type="checkbox" id="try-premium">
                    <label for="try-premium">Try Premium</label>
                </div>
                <div class="option">
                    <input type="checkbox" id="profile" checked>
                    <label for="profile">Profile</label>
                </div>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search songs, artists..." class="search-box">
        </div>

        <!-- Login Button -->
        <div class="login-section">
            <button class="login-btn">Login</button>
        </div>

        <!-- Trending Now -->
        <div class="trending-section">
            <h3 class="section-title">Trending Now</h3>
            <div class="song-list" id="songList">
                <!-- Songs will be loaded here -->
            </div>
        </div>

        <!-- Audio Player -->
        <audio id="audioPlayer" controls style="display: none;"></audio>
    </div>

    <script src="script.js"></script>
</body>
</html>
